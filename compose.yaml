services:
  chores-tracker:
    build:
      context: .
    image: chores-tracker:local
    container_name: chores-tracker
    restart: unless-stopped
    ports:
      - "${CHORE_TRACKER_PORT:-8080}:80"
    labels:
      app: chores-tracker
      service: web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
